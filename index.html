<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>Story Mock</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }

    .media {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    #storyImage {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    /*
     * 軽量版タイマー表示
     */

    #elapsedTimer {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 10;
      transform: translate3d(-50%, -50%, 0);

      width: 34vw;
      text-align: center;

      color: #fff;
      font-family: Arial, sans-serif;
      font-size: clamp(34px, 9vw, 72px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;

      -webkit-text-stroke: 2px #e00000;

      /* タイマー部分をタップしても画像へ届く */
      pointer-events: none;
      user-select: none;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main id="app">
    <video
      id="openingVideo"
      class="media"
      src="resource/000.mp4"
      autoplay
      muted
      playsinline
      preload="auto"
      disablepictureinpicture
    ></video>

    <img
      id="storyImage"
      class="media"
      src=""
      alt="ストーリー画像"
      hidden
    >

    <div id="elapsedTimer">00:00</div>
  </main>

  <script>
    /*
     * 画像の表示順
     */

    const imageFiles = [
      "resource/_p010.png",
      "resource/_p020.png",
      "resource/_p030.png",
      "resource/_p040.png",
      "resource/_p050.png",
      "resource/_p060.png",
      "resource/_p070.png",
      "resource/_p080.png",
      "resource/_p090.png",
      "resource/_p100.png",
      "resource/_p110.png",
      "resource/_p120.png",
      "resource/020.png",
      "resource/030.png",
      "resource/040.png",
      "resource/050.png",
      "resource/060.png",
      "resource/061.png",
      "resource/070.png",
      "resource/080.png",
      "resource/090.png",
      "resource/100.png",
      "resource/110.png",
      "resource/120.png",
      "resource/130.png",
      "resource/140.png",
      "resource/150.png",
      "resource/160.png",
      "resource/170.png",
      "resource/180.png",
      "resource/190.png",
      "resource/200.png",
      "resource/210.png",
      "resource/211.png",
      "resource/220.png",
      "resource/230.png",
      "resource/240.png",
      "resource/250.png",
      "resource/260.png",
      "resource/270.png",
      "resource/280.png",
      "resource/290.png",
      "resource/300.png",
      "resource/301.png",
      "resource/302.png",
      "resource/310.png",
      "resource/320.png",
      "resource/330.png",
      "resource/340.png",
      "resource/350.png",
      "resource/360.png",
      "resource/370.png",
      "resource/380.png",
      "resource/390.png",
      "resource/400.png",
      "resource/410.png",
      "resource/420.png",
      "resource/430.png",
      "resource/440.png",
      "resource/450.png",
      "resource/460.png",
      "resource/470.png",
      "resource/471.png",
      "resource/480.png",
      "resource/490.png",
      "resource/500.png",
      "resource/501.png",
      "resource/502.png",
      "resource/503.png",
      "resource/510.png",
      "resource/520.png",
      "resource/530.png",
      "resource/540.png",
      "resource/550.png",
      "resource/560.png",
      "resource/570.png",
      "resource/580.png"
    ];

    /*
     * 使用する画面要素
     */

    const video =
      document.querySelector("#openingVideo");

    const storyImage =
      document.querySelector("#storyImage");

    const elapsedTimer =
      document.querySelector("#elapsedTimer");

    let currentImageIndex = 0;

    /*
     * 経過時間
     */

    let timerStartedAt = 0;
    let timerIntervalId = null;

    function updateTimer() {
      const elapsedMilliseconds =
        performance.now() - timerStartedAt;

      const elapsedSeconds =
        Math.floor(elapsedMilliseconds / 1000);

      const minutes =
        Math.floor(elapsedSeconds / 60);

      const seconds =
        elapsedSeconds % 60;

      elapsedTimer.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
    }

    function startTimer() {
      timerStartedAt = performance.now();
      elapsedTimer.textContent = "00:00";

      /*
       * 1秒に1回だけ更新する軽量版
       */
      timerIntervalId =
        setInterval(updateTimer, 1000);
    }

    function stopTimer() {
      /*
       * 停止直前の正確な秒数を表示
       */
      updateTimer();

      if (timerIntervalId !== null) {
        clearInterval(timerIntervalId);
        timerIntervalId = null;
      }
    }

    /*
     * 画像の先読み
     */

    const preloadedImages = new Map();

    function preloadImagesFrom(
      startIndex,
      count = 10
    ) {
      const endIndex = Math.min(
        startIndex + count,
        imageFiles.length
      );

      for (
        let index = startIndex;
        index < endIndex;
        index += 1
      ) {
        if (preloadedImages.has(index)) {
          continue;
        }

        const image = new Image();
        image.src = imageFiles[index];

        preloadedImages.set(index, image);
      }
    }

    /*
     * 動画終了後、最初の画像を表示
     */

    function showFirstImage() {
      video.hidden = true;

      currentImageIndex = 0;

      storyImage.src =
        imageFiles[currentImageIndex];

      storyImage.hidden = false;

      /*
       * 先の10枚を準備
       */
      preloadImagesFrom(
        currentImageIndex + 1
      );

      /*
       * 画像が1枚だけならここで終了
       */
      if (
        currentImageIndex ===
        imageFiles.length - 1
      ) {
        stopTimer();
      }
    }

    /*
     * タップされたら次の画像を表示
     */

    function showNextImage() {
      /*
       * 最後の画像では何もしない
       */
      if (
        currentImageIndex >=
        imageFiles.length - 1
      ) {
        return;
      }

      currentImageIndex += 1;

      storyImage.src =
        imageFiles[currentImageIndex];

      /*
       * 通過した画像を先読みリストから外す
       */
      preloadedImages.delete(
        currentImageIndex - 1
      );

      /*
       * 最後の画像を表示した瞬間に停止
       */
      if (
        currentImageIndex ===
        imageFiles.length - 1
      ) {
        stopTimer();
        return;
      }

      /*
       * 常に先の10枚を準備
       */
      preloadImagesFrom(
        currentImageIndex + 1
      );
    }

    /*
     * 動画の自動再生
     */

    async function tryAutoplay() {
      try {
        await video.play();
      } catch {
        /*
         * 自動再生に失敗しても
         * タイマーはそのまま進みます。
         */
      }
    }

    /*
     * 動画が再生されてから5秒後に
     * 最初の10枚を先読みします。
     *
     * 動画の読み込みを優先するため、
     * 画像をすぐには読み込みません。
     */

    video.addEventListener(
      "playing",
      () => {
        setTimeout(() => {
          preloadImagesFrom(0);
        }, 5000);
      },
      { once: true }
    );

    /*
     * 動画終了時
     */

    video.addEventListener(
      "ended",
      showFirstImage
    );

    /*
     * 動画エラー時は画像へ進む
     */

    video.addEventListener(
      "error",
      showFirstImage
    );

    /*
     * 画像タップ時
     */

    storyImage.addEventListener(
      "click",
      showNextImage
    );

    /*
     * 起動
     */

    startTimer();
    tryAutoplay();
  </script>
</body>
</html>
