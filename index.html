<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Story Mock</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
    }

    .media {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    #storyImage {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    [hidden] {
      display: none !important;
    }
    
  </style>
</head>
<body>
  <main id="app">
    <video
      id="openingVideo"
      class="media"
      src="resource/000.mp4"
      autoplay
      muted
      playsinline
      preload="auto"
      disablepictureinpicture
    ></video>

    <img id="storyImage" class="media" src="" alt="ストーリー画像" hidden>
  </main>

  <script>
    // 画像を増やす場合は、この配列へ表示順にファイル名を追加してください。

      "resource/_p010.png",
      "resource/_p020.png",
      "resource/_p030.png",
      "resource/_p040.png",
      "resource/_p050.png",
      "resource/_p060.png",
      "resource/_p070.png",
      "resource/_p080.png",
      "resource/_p090.png",
      "resource/_p100.png",
      "resource/_p110.png",
      "resource/_p120.png",
      "resource/020.png",
      "resource/030.png",
      "resource/040.png",
      "resource/050.png",
      "resource/060.png",
      "resource/061.png",

      "resource/370.png",
      "resource/380.png",
      "resource/390.png",
      "resource/400.png",
      "resource/410.png",
      "resource/420.png",

      "resource/440.png",
      "resource/450.png",

      "resource/540.png",
      "resource/550.png",
      "resource/560.png",
      "resource/570.png",
      "resource/580.png"
    ];

    const video = document.querySelector("#openingVideo");
    const storyImage = document.querySelector("#storyImage");
    let currentImageIndex = 0;

    const preloadedImages = new Map();
    
    function preloadImagesFrom(startIndex, count = 10) {
      const endIndex = Math.min(
        startIndex + count,
        imageFiles.length
      );
    
      for (let index = startIndex; index < endIndex; index += 1) {
        if (preloadedImages.has(index)) continue;
    
        const image = new Image();
        image.src = imageFiles[index];
        preloadedImages.set(index, image);
      }
    }

    function showFirstImage() {
      video.hidden = true;
      currentImageIndex = 0;
      storyImage.src = imageFiles[currentImageIndex];
      storyImage.hidden = false;
    
      // 5枚先まで準備
      preloadImagesFrom(currentImageIndex + 1);
    }

    function showNextImage() {
      if (currentImageIndex >= imageFiles.length - 1) return;
    
      currentImageIndex += 1;
      storyImage.src = imageFiles[currentImageIndex];
      // 1つ前の画像を先読みリストから外す
      preloadedImages.delete(currentImageIndex - 1);
      // 常に5枚先まで準備
      preloadImagesFrom(currentImageIndex + 1);
    }
    
    // function preloadImage(index) {
    //   if (index >= imageFiles.length) return;
    
    //   const image = new Image();
    //   image.src = imageFiles[index];
    // }

    // function showFirstImage() {
    //   video.hidden = true;
    //   currentImageIndex = 0;
    //   storyImage.src = imageFiles[currentImageIndex];
    //   storyImage.hidden = false;
    //   // 次の1枚だけ先読み
    //   preloadImage(currentImageIndex + 1);
    // }

    // function showNextImage() {
    //   if (currentImageIndex >= imageFiles.length - 1) return;
    //   currentImageIndex += 1;
    //   storyImage.src = imageFiles[currentImageIndex];
    //   // 次の1枚だけ先読み
    //   preloadImage(currentImageIndex + 1);
    // }

    async function tryAutoplay() {
      try {
        await video.play();
      } catch {
      }
    }

    video.addEventListener("playing", () => {
      preloadImagesFrom(0);
    }, { once: true });
    
    // video.addEventListener("playing", () => {
    //   preloadImage(0);
    // }, { once: true });
    
    video.addEventListener("ended", showFirstImage);
    video.addEventListener("error", showFirstImage);
    storyImage.addEventListener("click", showNextImage);

    tryAutoplay();
  </script>
</body>
</html>
